<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eindeepseek → Wuxing Valve</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta http-equiv="refresh" content="1; url=https://www.wuxingvalve.com/" />
  <style>
    :root{--bg:#f7f8fa;--text:#222;--muted:#555;--primary:#2b7de9;--card:#fff;--border:#ddd;}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
    .wrap{max-width:920px;margin:0 auto;padding:28px 16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:18px}
    h1{margin:0 0 10px;font-size:22px}
    p{margin:8px 0;color:var(--muted);line-height:1.6}
    a.btn{display:inline-block;margin-top:10px;background:var(--primary);color:#fff;text-decoration:none;
      padding:10px 14px;border-radius:12px;font-weight:800}
    .small{margin-top:12px;font-size:12px;color:#777}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1 id="ttl">正在跳转到 Wuxing Valve 官网…</h1>
      <p id="desc">如果没有自动跳转，请点击下方按钮。</p>
      <a class="btn" href="https://www.wuxingvalve.com/" target="_blank" rel="noopener" id="btn">打开 www.wuxingvalve.com</a>
      <div class="small" id="tip">提示：你也可以返回首页继续浏览 Eindeepseek 产品展示。</div>
    </div>
  </div>

<script>
  const qs = new URLSearchParams(location.search);
  const lang = (qs.get('lang') || localStorage.getItem('lang') || 'zh').toLowerCase();

  const I18N = {
    zh:{
      ttl:'正在跳转到 Wuxing Valve 官网…',
      desc:'如果没有自动跳转，请点击下方按钮。',
      btn:'打开 www.wuxingvalve.com',
      tip:'提示：你也可以返回首页继续浏览 Eindeepseek 产品展示。'
    },
    en:{
      ttl:'Redirecting to the Wuxing Valve website…',
      desc:'If you are not redirected automatically, click the button below.',
      btn:'Open www.wuxingvalve.com',
      tip:'Tip: You can go back to the homepage to keep browsing Eindeepseek.'
    },
    de:{
      ttl:'Weiterleitung zur Wuxing Valve Website…',
      desc:'Falls die Weiterleitung nicht automatisch erfolgt, klicken Sie bitte unten.',
      btn:'www.wuxingvalve.com öffnen',
      tip:'Tipp: Sie können zur Startseite zurückkehren und Eindeepseek weiter ansehen.'
    }
  };
  const t = I18N[lang] || I18N.zh;
  document.getElementById('ttl').textContent = t.ttl;
  document.getElementById('desc').textContent = t.desc;
  document.getElementById('btn').textContent = t.btn;
  document.getElementById('tip').textContent = t.tip;

  // JS redirect (backup)
  setTimeout(()=>{ location.href = 'https://www.wuxingvalve.com/'; }, 600);
</script>
</body>
</html>
