<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eindeepseek · 产品精选</title>

  <!-- SEO / OpenGraph -->
  <meta name="description" content="Eindeepseek B2C 产品展示，多语言；仅在存在 1.png 时显示卡片。" />
  <meta property="og:title" content="Eindeepseek · 产品精选" />
  <meta property="og:description" content="多语言产品展示网站：自动读取文案，仅显示有内容的产品（只识别 PNG）。" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://www.eindeepseek.com/group.jpeg" />
  <meta property="og:url" content="https://www.eindeepseek.com/" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Eindeepseek · 产品精选" />
  <meta name="twitter:description" content="多语言产品展示网站：自动读取文案，仅显示有内容的产品（只识别 PNG）。" />

  <link rel="dns-prefetch" href="//www.eindeepseek.com">
  <link rel="preconnect" href="https://www.eindeepseek.com" crossorigin>

  <style>
    :root{
      --bg:#f7f8fa; --text:#222; --muted:#555; --primary:#2b7de9;
      --card:#fff; --border:#ddd; --ring:rgba(43,125,233,.18);
      --skeleton:#eef1f5; --skeleton-shimmer:#f7f8fb;

      /* cookie 出现时用于顶起 FX */
      --cookie-offset: 0px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border)}
    .brand a{color:var(--text);text-decoration:none;font-weight:800;letter-spacing:.3px}
    .lang{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px}
    .lang button{appearance:none;border:none;cursor:pointer;padding:6px 10px;border-radius:999px;color:var(--muted);background:transparent;font-weight:600}
    .lang button.active{color:#fff;background:var(--primary);box-shadow:0 0 0 6px var(--ring) inset}

    .wrap{max-width:1200px;margin:0 auto;padding:18px 16px 56px}
    h1{font-size:28px;margin:10px 0 8px}
    p.lead{color:var(--muted);margin:0 0 10px}

    .contactbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 16px}
    .contactbar a,.contactbar span{background:#fff;border:1px solid var(--border);padding:8px 10px;border-radius:10px;color:var(--text);text-decoration:none;font-size:14px}
    .contactbar a:hover{background:#f1f5ff;border-color:#cfe0ff}

    .grid{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:24px;align-items:start}
    @media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media(min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}

    .card{
      position:relative;overflow:hidden;border-radius:14px;background:var(--card);border:1px solid var(--border);
      box-shadow:0 2px 10px rgba(0,0,0,.06);
      transform:translateY(6px);opacity:0;animation:rise .45s ease forwards;
      transition:transform .18s ease, box-shadow .18s ease
    }
    .card:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.12)}
    @keyframes rise{to{transform:none;opacity:1}}

    .thumb{aspect-ratio:4/3;width:100%;display:block;object-fit:cover;background:#f1f3f5}

    .body{padding:12px 14px 16px}
    .title{font-weight:800;margin:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#111}

    .desc{
      color:var(--muted);margin:0;line-height:1.55;
      display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
      min-height: calc(1.55em * 2); /* 保留两行高度 */
    }

    .badge{position:absolute;top:10px;left:10px;background:#111;color:#fff;padding:2px 8px;border-radius:999px;font-size:12px;opacity:.85}

    .cardlink{display:block;text-decoration:none;color:inherit}

    .skeleton{position:relative;overflow:hidden;background:var(--skeleton)}
    .skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg, transparent, var(--skeleton-shimmer), transparent);animation:shimmer 1.2s infinite}
    @keyframes shimmer{to{transform:translateX(100%)}}

    .qr-thumb{max-width:180px;max-height:180px;margin:16px auto;display:block;border-radius:10px;border:1px solid var(--border);background:#fff}

    footer{border-top:1px solid var(--border);text-align:center;padding:14px;color:var(--muted);margin-top:26px}

    /* Cookie banner */
    .cookie-wrap{position:fixed;left:0;right:0;bottom:0;z-index:100000;display:none}
    .cookie-bar{
      max-width:1200px;margin:10px auto;background:#111;color:#fff;border-radius:12px;padding:14px;border:1px solid #000a;
      display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 6px 24px rgba(0,0,0,.25)
    }
    .cookie-bar p{margin:0;line-height:1.5;flex:1 1 320px;color:#e6e6e6}
    .cookie-bar a{color:#9ec5ff}
    .cookie-actions{display:flex;gap:8px}
    .cookie-actions button{cursor:pointer;border:none;border-radius:10px;padding:8px 12px;font-weight:700}
    .cookie-accept{background:#2b7de9;color:#fff}
    .cookie-reject{background:#fff;color:#111;border:1px solid #ccc}
  </style>
</head>
<body>
  <header>
    <div class="brand"><a href="./">Eindeepseek</a></div>
    <div class="lang" id="langSwitcher">
      <button data-lang="zh">ZH</button>
      <button data-lang="en">EN</button>
      <button data-lang="de">DE</button>
    </div>
  </header>

  <div class="wrap">
    <div class="contactbar" id="contactBar"></div>

    <h1 id="heading">产品展示</h1>
    <p class="lead" id="sub"></p>

    <div class="grid" id="grid">
      <div class="card"><div class="thumb skeleton"></div><div class="body"><div class="title skeleton" style="height:18px;width:60%"></div><p class="desc skeleton" style="height:38px"></p></div></div>
      <div class="card"><div class="thumb skeleton"></div><div class="body"><div class="title skeleton" style="height:18px;width:60%"></div><p class="desc skeleton" style="height:38px"></p></div></div>
      <div class="card"><div class="thumb skeleton"></div><div class="body"><div class="title skeleton" style="height:18px;width:60%"></div><p class="desc skeleton" style="height:38px"></p></div></div>
    </div>
  </div>

  <footer>© <span id="y"></span> Eindeepseek</footer>

  <!-- Cookie banner (only shows for EN/DE) -->
  <div class="cookie-wrap" id="cookieWrap" aria-live="polite">
    <div class="cookie-bar" id="cookieBar">
      <p id="cookieText">
        We use cookies (only Google Analytics) to understand traffic and improve our site. You can accept or reject non-essential cookies.
        See our <a href="/privacy.html" target="_blank" rel="noopener">Privacy Notice</a>.
      </p>
      <div class="cookie-actions">
        <button class="cookie-reject" id="cookieReject">Reject</button>
        <button class="cookie-accept" id="cookieAccept">Accept</button>
      </div>
    </div>
  </div>

  <script>
    /* ---------- i18n ----------- */
    const I18N = {
      zh:{
        title:'产品展示',
        sub:'Eindeepseek 专注消费电子、小家电与工业品的跨境贸易供应，提供 OEM/ODM、现货与定制服务，致力于为全球客户提供优质产品与可靠的物流支持。',
        groupTitle:'加入 WhatsApp 群组',
        groupDesc:'扫码二维码，进入我们的贸易 & 物流交流群。',
        email:'邮件',whats:'WhatsApp',phone:'电话',wechat:'微信',wuxing:'五星阀门官网',
        cbamTitle:'CBAM 2026：需交“碳证”，<50t/年或可免',
        cbamDesc:'时间线/默认值/成本与我们能提供的合规+低碳运价方案。',
        depTitle:'研究：美国对欧进口依赖超过对中国',
        depDesc:'关键数字与两条打法（美线做到岸透明，欧线做合规省心）。'
      },
      en:{
        title:'Products',
        sub:'Eindeepseek is a cross-border trade supplier of consumer electronics, small appliances and industrial products. We provide OEM/ODM, ready-to-ship and customized services, delivering quality products with reliable logistics support worldwide.',
        groupTitle:'Join WhatsApp Group',
        groupDesc:'Scan the QR code to join our trade & logistics group.',
        email:'Email',whats:'WhatsApp',phone:'Phone',wechat:'WeChat',wuxing:'Wuxing Valve Website',
        cbamTitle:'CBAM 2026: Certificates required; <50t/year may be exempt',
        cbamDesc:'Timeline, default values, cost structure + our compliance & low-carbon offer.',
        depTitle:'Study: US import dependence on EU now exceeds China',
        depDesc:'Key numbers & playbooks: transparent landed cost (US), compliance-first (EU).'
      },
      de:{
        title:'Produkte',
        sub:'Eindeepseek ist ein grenzüberschreitender Handelspartner für Unterhaltungselektronik, Kleingeräte und Industrieprodukte. Wir bieten OEM/ODM, Lagerware und kundenspezifische Lösungen und liefern weltweit qualitativ hochwertige Produkte mit zuverlässiger Logistik.',
        groupTitle:'WhatsApp-Gruppe beitreten',
        groupDesc:'QR-Code scannen, um unserer Handels- & Logistik-Gruppe beizutreten.',
        email:'E-Mail',whats:'WhatsApp',phone:'Telefon',wechat:'WeChat',wuxing:'Wuxing Valve Webseite',
        cbamTitle:'CBAM 2026: Zertifikate Pflicht; <50 t/Jahr evtl. befreit',
        cbamDesc:'Zeitplan, Default-Werte, Kostenstruktur + unser Compliance/Low-Carbon-Paket.',
        depTitle:'Studie: US-Importabhängigkeit von der EU überholt China',
        depDesc:'Kerndaten & Playbooks: transparente Landed Costs (US), Compliance-Fokus (EU).'
      }
    };

    const COOKIE_TXT = {
      en:{
        text:'We use cookies (only Google Analytics) to understand traffic and improve our site. You can accept or reject non-essential cookies. See our <a href="/privacy.html" target="_blank" rel="noopener">Privacy Notice</a>.',
        accept:'Accept', reject:'Reject'
      },
      de:{
        text:'Wir verwenden Cookies (nur Google Analytics), um den Traffic zu verstehen und unsere Website zu verbessern. Sie können nicht notwendige Cookies akzeptieren oder ablehnen. Siehe unsere <a href="/privacy.html" target="_blank" rel="noopener">Datenschutzhinweise</a>.',
        accept:'Akzeptieren', reject:'Ablehnen'
      }
    };

    /* ---------- language & UI texts ---------- */
    const pageQS = new URLSearchParams(location.search);
    const currentLang = (pageQS.get('lang') || localStorage.getItem('lang') || 'zh').toLowerCase();
    localStorage.setItem('lang', currentLang);
    const t = I18N[currentLang] || I18N.zh;

    document.getElementById('heading').textContent = t.title;
    document.getElementById('sub').textContent = t.sub;

    [...document.querySelectorAll('#langSwitcher button')].forEach(b=>{
      if(b.dataset.lang===currentLang) b.classList.add('active');
      b.onclick=()=>{
        const lang=b.dataset.lang;
        localStorage.setItem('lang',lang);
        const url=new URL(location.href);
        url.searchParams.set('lang',lang);
        location.href=url.toString();
      };
    });

    const CONTACT={email:'wengandy128@gmail.com',whatsapp:'+86 15888791812',phone:'+86 15888791812',wechat:'15888791812',waInvite:''};
    document.getElementById('contactBar').innerHTML=`
      <a href="mailto:${CONTACT.email}">📧 ${t.email}: ${CONTACT.email}</a>
      <a href="https://wa.me/${CONTACT.whatsapp.replace(/[^0-9]/g,'')}" target="_blank" rel="noopener">💬 ${t.whats}</a>
      <a href="tel:${CONTACT.phone.replace(/\s/g,'')}">📞 ${t.phone}: ${CONTACT.phone}</a>
      <span>🟩 ${t.wechat}: ${CONTACT.wechat}</span>
      <a href="wuxingvalve.html" target="_blank" rel="noopener">🔗 ${t.wuxing}</a>
    `;

    /* ---------- cookie consent + GA ---------- */
    const GA_ID = 'G-SP9BZHN30E';
    function loadGA(){
      if(window.__gaLoaded) return;
      window.__gaLoaded = true;
      const s=document.createElement('script');
      s.async=true; s.src=`https://www.googletagmanager.com/gtag/js?id=${GA_ID}`;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag('js', new Date());
      gtag('config', GA_ID);
    }
    function disableGA(){ window['ga-disable-'+GA_ID] = true; }

    const consentKey='cookieConsent:v1';
    const saved = localStorage.getItem(consentKey);

    // cookie 顶起 FX
    const cookieWrap = document.getElementById('cookieWrap');
    const cookieBar  = document.getElementById('cookieBar');
    function setCookieOffset(px){
      document.documentElement.style.setProperty('--cookie-offset', (px || 0) + 'px');
    }
    function calcCookieOffset(){
      return (cookieBar?.offsetHeight || 0) + 20;
    }

    if(currentLang==='zh'){
      loadGA();
      setCookieOffset(0);
    }else{
      const cTxt = COOKIE_TXT[currentLang] || COOKIE_TXT.en;
      document.getElementById('cookieText').innerHTML = cTxt.text;
      document.getElementById('cookieAccept').textContent = cTxt.accept;
      document.getElementById('cookieReject').textContent = cTxt.reject;

      function show(){
        cookieWrap.style.display='block';
        setCookieOffset(calcCookieOffset());
      }
      function hide(){
        cookieWrap.style.display='none';
        setCookieOffset(0);
      }

      if(!saved){
        disableGA();
        show();
      }else{
        try{
          const st = JSON.parse(saved);
          if(st.status==='accepted') loadGA(); else disableGA();
        }catch{ disableGA(); }
        hide();
      }

      document.getElementById('cookieAccept').onclick=()=>{
        localStorage.setItem(consentKey, JSON.stringify({status:'accepted',ts:Date.now()}));
        hide(); loadGA();
      };
      document.getElementById('cookieReject').onclick=()=>{
        localStorage.setItem(consentKey, JSON.stringify({status:'rejected',ts:Date.now()}));
        hide(); disableGA();
      };

      window.addEventListener('resize', ()=>{
        if(cookieWrap.style.display==='block'){
          setCookieOffset(calcCookieOffset());
        }
      });
    }

    /* ---------- content building ---------- */
    function fetchWithTimeout(url,ms=2500){
      const ctl=new AbortController();
      const id=setTimeout(()=>ctl.abort(),ms);
      return fetch(url,{cache:'no-store',signal:ctl.signal}).finally(()=>clearTimeout(id));
    }
    async function tryJson(url){
      try{ const r=await fetchWithTimeout(url,2500); if(r.ok) return await r.json(); }catch(e){}
      return null;
    }
    async function existsAny(url){
      try{ const r=await fetchWithTimeout(url,1800); return r.ok; }catch(e){ return false; }
    }

    // ✅ 资讯卡：不再做“存在性预检测”，改为 img onerror 自动 fallback
    function insightThumbHTML(img, altText){
      const safeAlt = (altText || '').replace(/"/g,'&quot;');
      return `
        <img class="thumb" src="${img}" alt="${safeAlt}" loading="lazy" decoding="async"
          onerror="this.outerHTML='<div class=&quot;thumb&quot; style=&quot;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px&quot;>ℹ️</div>'">
      `;
    }

    const INSIGHT_CARDS = [
      { href:'/insights/cbam-2026.html', img:'/insights/1.png', badge:'EU·CBAM', titleKey:'cbamTitle', descKey:'cbamDesc' },
      { href:'/insights/us-eu-dependency.html', img:'/insights/2.png', badge:'Market',  titleKey:'depTitle',  descKey:'depDesc' }
    ];

    async function addInsightCards(grid){
      for(const c of INSIGHT_CARDS){
        const tl = (I18N[currentLang] && I18N[currentLang][c.titleKey]) || I18N.en[c.titleKey];
        const ds = (I18N[currentLang] && I18N[currentLang][c.descKey])  || I18N.en[c.descKey];

        const a = document.createElement('a');
        a.className = 'cardlink';
        a.href = c.href;
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML = `<article class="card">
            ${insightThumbHTML(c.img, tl)}
            <div class="body">
              <div class="title">${tl}</div>
              <p class="desc">${ds}</p>
            </div>
            <span class="badge">${c.badge}</span>
          </article>`;
        grid.appendChild(a);
      }
    }

    async function build(){
      const grid=document.getElementById('grid');
      grid.innerHTML='';

      // 资讯卡
      await addInsightCards(grid);

      // 群二维码卡（保留原逻辑：找到存在的文件再渲染）
      try{
        const qrCandidates=['group.jpeg','group.jpg','group.png','group.webp'];
        for(const u of qrCandidates){
          if(await existsAny(u)){
            const a=document.createElement('a'); a.className='cardlink'; a.href=u;
            a.onclick=()=>{ try{gtag('event','click_group');}catch(e){} };
            a.innerHTML=`<article class="card">
              <div class="thumb" style="display:flex;align-items:center;justify-content:center">
                <img src="${u}" alt="WhatsApp Group QR" class="qr-thumb" loading="eager" width="180" height="180">
              </div>
              <div class="body">
                <div class="title">${t.groupTitle}</div>
                <p class="desc">${t.groupDesc}</p>
              </div>
            </article>`;
            grid.appendChild(a);
            break;
          }
        }
      }catch{}

      // 产品卡
      const mf = await (async()=>{
        for(const u of ['manifest.json','/manifest.json','./manifest.json']){
          const d = await tryJson(u); if(d) return d;
        }
        return null;
      })();

      const items = Array.isArray(mf?.items) ? mf.items : [];

      for(const it of items){
        const id = Number(it.id); if(!id) continue;
        const slug = `product-${id}`;
        const img = `assets/imgs/${slug}/1.png`;

        if(!(await existsAny(img))) continue;

        const title = it?.title?.[currentLang] || it?.title?.en || it?.title?.zh || `Product ${id}`;
        const hrefURL = new URL(it?.href || `products/${slug}.html`, location.href);
        hrefURL.searchParams.set('lang', currentLang);

        const a = document.createElement('a');
        a.className='cardlink';
        a.href=hrefURL.toString();
        a.innerHTML = `<article class="card">
            <img class="thumb" src="${img}" alt="${title}" loading="lazy" decoding="async">
            <div class="body">
              <div class="title">${title}</div>
              <p class="desc"></p>
            </div>
            <span class="badge">${currentLang.toUpperCase()}</span>
          </article>`;
        grid.appendChild(a);
      }
    }

    build();
    document.getElementById('y').textContent=new Date().getFullYear();
  </script>

  <!-- ▼▼ FX：支持底部条 / 侧边缩小（手机默认侧边） ▼▼ -->
  <script>
  (() => {
    const CCY = ['CNY','USD','EUR','TWD'];
    const SUMMARY_PAIRS = [['USD','CNY'],['EUR','USD'],['EUR','CNY']];
    const DEC = 4;
    const POLL_MS = 5 * 60 * 1000;
    const STORE = 'fxWidget:v3';
    const DOCK_KEY = 'fxDock:v1'; // bottom | side

    const fxQS = new URLSearchParams(location.search);
    const lang = (fxQS.get('lang') || localStorage.getItem('lang') || 'zh').toLowerCase();

    const I18N = {
      zh:{ title:'实时汇率换算',amount:'金额',swap:'交换',refresh:'刷新',source:'数据源：exchangerate.host',loading:'加载中…',error:'网络错误',na:'不可用',
          hintBottom:'点击展开换算',hintSide:'点我换算',dockSide:'缩到侧边',dockBottom:'放到底部' },
      en:{ title:'Live FX Converter',amount:'Amount',swap:'Swap',refresh:'Refresh',source:'Source: exchangerate.host',loading:'Loading…',error:'Network error',na:'N/A',
          hintBottom:'Click to expand',hintSide:'Tap to open',dockSide:'Dock to side',dockBottom:'Dock to bottom' },
      de:{ title:'Live Wechselkursrechner',amount:'Betrag',swap:'Tauschen',refresh:'Aktualisieren',source:'Quelle: exchangerate.host',loading:'Laden…',error:'Netzwerkfehler',na:'Nicht verfügbar',
          hintBottom:'Klicken zum Öffnen',hintSide:'Tippen zum Öffnen',dockSide:'An Seite',dockBottom:'Unten' }
    };
    const T = I18N[lang] || I18N.zh;

    const isMobile = window.matchMedia && window.matchMedia('(max-width: 640px)').matches;

    let dock = localStorage.getItem(DOCK_KEY);
    if(dock !== 'bottom' && dock !== 'side'){
      dock = isMobile ? 'side' : 'bottom';
      localStorage.setItem(DOCK_KEY, dock);
    }
    function applyDock(){
      document.documentElement.setAttribute('data-fx-dock', dock);
      hint.textContent = (dock === 'side') ? T.hintSide : T.hintBottom;
      dockBtn.textContent = (dock === 'side') ? T.dockBottom : T.dockSide;
    }
    function toggleDock(){
      dock = (dock === 'side') ? 'bottom' : 'side';
      localStorage.setItem(DOCK_KEY, dock);
      applyDock();
    }

    const css = `
    :root{--fx-bg:#111;--fx-fg:#fff;--fx-line:#333;--fx-shadow:0 14px 44px rgba(0,0,0,.4);}

    .fx-mini{
      position:fixed;z-index:99998;display:flex;gap:10px;align-items:center;
      padding:12px 14px;border-radius:16px;background:var(--card,#fff);color:var(--text,#111);
      border:1px solid var(--border,#ddd);box-shadow:0 6px 22px rgba(0,0,0,.12);cursor:pointer;
      right:16px; bottom: calc(16px + var(--cookie-offset, 0px));
    }
    .fx-pill{display:flex;gap:8px;align-items:center;font-weight:800;background:var(--primary,#2b7de9);color:#fff;border-radius:999px;padding:8px 12px}
    .fx-rates{display:flex;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
    .fx-rate{background:#f1f3f5;border:1px solid #e3e6ea;border-radius:10px;padding:6px 8px}
    .fx-hint{font-size:12px;color:#888;margin-left:4px}

    .fx-wrap{
      position:fixed;right:16px;bottom: calc(84px + var(--cookie-offset, 0px));
      z-index:99999;background:var(--fx-bg);color:var(--fx-fg);
      border:1px solid #000;border-radius:18px;box-shadow:var(--fx-shadow);
      width:420px;max-width:calc(100vw - 32px);display:none
    }
    .fx-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--fx-line);gap:10px}
    .fx-title{font-weight:900;font-size:18px;letter-spacing:.2px}
    .fx-head-right{display:flex;gap:8px;align-items:center}
    .fx-btn-mini{all:unset;cursor:pointer;background:#222;border:1px solid var(--fx-line);padding:6px 10px;border-radius:10px;font-weight:800;color:#fff;font-size:12px}
    .fx-close{all:unset;cursor:pointer;background:#222;border:1px solid var(--fx-line);padding:6px 10px;border-radius:10px}

    .fx-body{padding:16px}
    .fx-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
    .fx-input,.fx-select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--fx-line);background:#222;color:#fff;font-size:16px}
    .fx-arrow{color:#bbb;text-align:center;font-size:18px}
    .fx-out{margin-top:12px;padding:12px;border:1px solid var(--fx-line);border-radius:12px;background:#1b1b1b;display:flex;align-items:center;justify-content:space-between;min-height:48px;font-size:16px}
    .fx-tools{padding:12px;display:flex;gap:10px}
    .fx-btn{cursor:pointer;border:1px solid var(--fx-line);background:#222;color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
    .fx-foot{padding:12px;font-size:12px;color:#9aa;display:flex;justify-content:space-between;border-top:1px solid var(--fx-line)}
    .fx-link{color:#9ec5ff;text-decoration:none}

    /* ===== 侧边缩小模式 ===== */
    html[data-fx-dock="side"] .fx-mini{
      bottom:auto;
      top: calc(50% - 28px);
      right: 8px;
      padding:10px 10px;
      border-radius:999px;
      gap:8px;
      transform: translateY(-50%);
    }
    html[data-fx-dock="side"] .fx-rates{display:none;}
    html[data-fx-dock="side"] .fx-hint{display:none;}
    html[data-fx-dock="side"] .fx-pill{padding:10px 12px;}
    html[data-fx-dock="side"] .fx-mini::after{
      content:"FX";
      font-weight:900;
      margin-left:6px;
      color:var(--text,#111);
      opacity:.85;
    }
    /* 侧边模式下，弹窗位置更居中 */
    html[data-fx-dock="side"] .fx-wrap{
      bottom:auto;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
    }
    @media(max-width:640px){
      html[data-fx-dock="side"] .fx-wrap{
        right: 12px;
        width: min(420px, calc(100vw - 24px));
      }
    }
    `;
    const style = document.createElement('style');
    style.textContent = css;
    document.head.appendChild(style);

    /* ---------- DOM ---------- */
    const mini = document.createElement('div');
    mini.className = 'fx-mini';
    mini.innerHTML = `
      <div class="fx-pill">FX</div>
      <div class="fx-rates" id="fx-mini-rates">
        <span class="fx-rate">—</span>
        <span class="fx-rate">—</span>
        <span class="fx-rate">—</span>
      </div>
      <span class="fx-hint" id="fx-hint">${T.hintBottom}</span>
    `;

    const wrap = document.createElement('section');
    wrap.className = 'fx-wrap';
    wrap.setAttribute('role','dialog');
    wrap.setAttribute('aria-modal','false');
    wrap.innerHTML = `
      <div class="fx-head">
        <div class="fx-title">${T.title}</div>
        <div class="fx-head-right">
          <button class="fx-btn-mini" id="fx-dock" type="button"></button>
          <button class="fx-close" type="button" aria-label="Close">×</button>
        </div>
      </div>
      <div class="fx-body">
        <div class="fx-grid">
          <input class="fx-input" id="fx-amt" type="number" min="0" step="0.01" placeholder="${T.amount}">
          <select class="fx-select" id="fx-from"></select>
          <div class="fx-arrow">→</div>
          <select class="fx-select" id="fx-to"></select>
        </div>
        <div class="fx-out">
          <span id="fx-res">—</span>
          <span id="fx-ts"></span>
        </div>
        <div class="fx-tools">
          <button class="fx-btn" id="fx-swap" type="button">${T.swap}</button>
          <button class="fx-btn" id="fx-refresh" type="button">${T.refresh}</button>
        </div>
      </div>
      <div class="fx-foot">
        <span>${T.source}</span>
        <a class="fx-link" href="https://exchangerate.host" target="_blank" rel="noopener">API</a>
      </div>
    `;

    document.body.appendChild(mini);
    document.body.appendChild(wrap);

    const hint = mini.querySelector('#fx-hint');
    const miniRatesEl = mini.querySelector('#fx-mini-rates');
    const dockBtn = wrap.querySelector('#fx-dock');

    applyDock();
    dockBtn.addEventListener('click', (e)=>{ e.stopPropagation(); toggleDock(); });

    const $ = sel => wrap.querySelector(sel);
    const amt = $('#fx-amt'), fromSel = $('#fx-from'), toSel = $('#fx-to'), res = $('#fx-res'), ts = $('#fx-ts');

    /* ---------- init selects ---------- */
    (function initSelects(){
      CCY.forEach(c=>{
        const o1 = document.createElement('option'); o1.value=c; o1.textContent=c; fromSel.appendChild(o1);
        const o2 = document.createElement('option'); o2.value=c; o2.textContent=c; toSel.appendChild(o2);
      });
      try{
        const saved = JSON.parse(localStorage.getItem(STORE) || '{}');
        fromSel.value = saved.from || 'CNY';
        toSel.value = saved.to || 'USD';
        amt.value = saved.amt ?? 100;
      }catch{
        fromSel.value='CNY'; toSel.value='USD'; amt.value=100;
      }
    })();

    /* ---------- rate fetch (primary + fallback) ---------- */
    let cache = { base: null, ts: 0, rates: null, date: '' };
    const now = () => Date.now();

    async function fetchRates(base){
      try{
        const u = `https://api.exchangerate.host/latest?base=${encodeURIComponent(base)}`;
        const r = await fetch(u, { cache: 'no-store' });
        if(!r.ok) throw new Error('host http');
        const j = await r.json();
        if(!j || !j.rates) throw new Error('host json');
        cache = { base: j.base || base, ts: now(), rates: j.rates, date: j.date || '' };
        return;
      }catch(e){}
      const u2 = `https://open.er-api.com/v6/latest/${encodeURIComponent(base)}`;
      const r2 = await fetch(u2, { cache: 'no-store' });
      const j2 = await r2.json();
      if(j2 && j2.rates){
        cache = { base: j2.base_code || base, ts: now(), rates: j2.rates, date: (j2.time_last_update_utc || '').replace(' at','') };
        return;
      }
      throw new Error('rate fetch failed');
    }

    function fmt(n){
      return Number(n).toLocaleString(undefined,{ maximumFractionDigits: DEC });
    }

    function getCross(baseRates, from, to){
      if(from === cache.base) return baseRates[to];
      if(to === cache.base) return 1 / baseRates[from];
      return (baseRates[to] != null && baseRates[from] != null) ? (baseRates[to] / baseRates[from]) : null;
    }

    function renderMiniRates(){
      const out = [];
      for(const [a,b] of SUMMARY_PAIRS){
        const rate = getCross(cache.rates || {}, a, b);
        out.push(`<span class="fx-rate">${a}/${b} ${rate != null ? fmt(rate) : T.na}</span>`);
      }
      miniRatesEl.innerHTML = out.join('');
    }

    async function compute(){
      const a = parseFloat(amt.value || '0');
      const from = fromSel.value, to = toSel.value;
      localStorage.setItem(STORE, JSON.stringify({ amt: amt.value, from, to }));

      try{
        if(cache.base !== from || !cache.rates || (now() - cache.ts) > POLL_MS){
          res.textContent = T.loading;
          await fetchRates(from);
        }
        if(a){
          const rate = cache.rates[to];
          if(rate == null){ res.textContent = T.na; ts.textContent=''; }
          else { res.textContent = `${from} ${fmt(a)} = ${to} ${fmt(a * rate)}`; ts.textContent = cache.date; }
        }else{
          res.textContent = '—'; ts.textContent = cache.date || '';
        }
        renderMiniRates();
      }catch(e){
        res.textContent = T.error;
        miniRatesEl.innerHTML = `<span class="fx-rate">${T.error}</span>`;
      }
    }

    /* ---------- interactions ---------- */
    [amt, fromSel, toSel].forEach(el => el.addEventListener('input', compute));

    wrap.querySelector('.fx-close').addEventListener('click', () => { wrap.style.display='none'; });
    $('#fx-refresh')?.addEventListener('click', () => { cache.base=null; compute(); });
    $('#fx-swap')?.addEventListener('click', () => {
      const f = fromSel.value; fromSel.value = toSel.value; toSel.value = f; compute();
    });

    mini.addEventListener('click', () => {
      const show = wrap.style.display !== 'block';
      wrap.style.display = show ? 'block' : 'none';
      if(show){ compute(); amt.focus(); }
    });

    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') wrap.style.display='none'; });

    let timer = setInterval(() => {
      if(wrap.style.display === 'block'){ cache.base=null; compute(); }
    }, POLL_MS);

    document.addEventListener('visibilitychange', () => {
      if(document.hidden){ clearInterval(timer); timer=null; }
      else if(!timer){ timer=setInterval(()=>{ if(wrap.style.display === 'block'){ cache.base=null; compute(); } }, POLL_MS); }
    });

    compute();
  })();
  </script>
</body>
</html>
