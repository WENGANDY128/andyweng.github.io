<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eindeepseek – Product 3 (Ocean Freight Update)</title>
  <meta name="description" content="Ocean freight rate update gallery with fullscreen zoomable lightbox (ZH/EN/DE)." />
  <style>
    :root{--bg:#f7f8fa;--text:#222;--muted:#555;--primary:#2b7de9;--card:#fff;--border:#ddd}
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border)}
    .brand a{color:var(--text);text-decoration:none;font-weight:800}
    .lang{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:999px;padding:6px}
    .lang button{appearance:none;border:none;cursor:pointer;padding:6px 10px;border-radius:999px;color:var(--muted);background:transparent;font-weight:600}
    .lang button.active{color:#fff;background:var(--primary)}
    .wrap{max-width:1100px;margin:0 auto;padding:18px 16px 56px}
    h1{font-size:28px;margin:8px 0}
    p.lead{color:var(--muted);margin:0 0 12px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:560px){.grid{grid-template-columns:1fr}}
    .card{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card);cursor:pointer;transition:.18s}
    .card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08)}
    .thumb{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eef1f5;display:block}
    .cap{padding:8px 10px;font-weight:600}
    /* Lightbox */
    .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:30}
    .lightbox.show{display:flex}
    .stage{position:relative;width:100%;height:100%;touch-action:none;user-select:none;overflow:hidden}
    .stage img{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1);transform-origin:center center;max-width:none;max-height:none}
    .tools{position:fixed;top:12px;right:12px;display:flex;gap:8px}
    .btn{background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;font-weight:700}
    .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#fff;opacity:.8;font-size:12px}
  </style>
</head>
<body>
  <header>
    <div class="brand"><a id="homeLink" href="../index.html">Eindeepseek</a></div>
    <div class="lang" id="langSwitcher">
      <button data-lang="zh">ZH</button>
      <button data-lang="en">EN</button>
      <button data-lang="de">DE</button>
    </div>
  </header>

  <div class="wrap">
    <h1 id="title">Product 3</h1>
    <p class="lead" id="sub">Ocean freight rate update — click any image to view full-size and zoom.</p>

    <div class="grid" id="grid"></div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="box" aria-modal="true" role="dialog">
    <div class="stage" id="stage">
      <img id="big" alt="full preview">
    </div>
    <div class="tools">
      <button class="btn" id="zin">＋</button>
      <button class="btn" id="zout">－</button>
      <button class="btn" id="fit">⟳</button>
      <button class="btn" id="close">✕</button>
    </div>
    <div class="hint" id="hint">Wheel to zoom · drag to pan · double‑click to toggle zoom · Esc to close</div>
  </div>

  <script>
    const I18N={
      zh:{title:'海运价格更新',sub:'本页用于展示海运价目表与截图。点击任意图片可全屏查看、缩放与拖拽（支持长图 full.png）。',cap:'海运价格'},
      en:{title:'Ocean Freight Rate Update',sub:'This page shows ocean rate sheets and screenshots. Click any image to open fullscreen with zoom & pan (long image full.png supported).',cap:'Freight Sheet'},
      de:{title:'Seefracht‑Preisupdate',sub:'Diese Seite zeigt Seefracht‑Tarife und Screenshots. Bild anklicken für Vollbild mit Zoom & Pan (lange Grafik full.png unterstützt).',cap:'Frachttarif'}
    };
    const qs=new URLSearchParams(location.search);
    const lang=(qs.get('lang')||localStorage.getItem('lang')||'zh').toLowerCase();
    localStorage.setItem('lang',lang);
    const t=(k)=>I18N[lang]?.[k]||I18N.en[k];

    document.getElementById('title').textContent=t('title');
    document.getElementById('sub').textContent=t('sub');

    // Lang switcher
    [...document.querySelectorAll('#langSwitcher button')].forEach(b=>{
      if(b.dataset.lang===lang) b.classList.add('active');
      b.onclick=()=>{const u=new URL(location.href);u.searchParams.set('lang',b.dataset.lang);localStorage.setItem('lang',b.dataset.lang);location.href=u.toString();};
    });
    const home=new URL('../index.html',location.href); home.searchParams.set('lang',lang); document.getElementById('homeLink').href=home.toString();

    // Build gallery from /assets/imgs/product-3/1..20.(png/jpg/jpeg/webp)
    const exts=['png','jpg','jpeg','webp'];
    function probe(src){ return new Promise(res=>{ const im=new Image(); im.onload=()=>res(src); im.onerror=()=>res(''); im.src=src; }); }
    async function firstExisting(paths){ for(const p of paths){ const ok=await probe(p); if(ok) return ok; } return ''; }

    async function build(){
      const grid=document.getElementById('grid');
      for(let i=1;i<=20;i++){
        const base=`../assets/imgs/product-3/${i}`;
        const src=await firstExisting(exts.map(e=>`${base}.${e}`));
        if(!src) continue;
        const card=document.createElement('div');
        card.className='card';
        card.innerHTML=`<img class="thumb" src="${src}" alt="${t('cap')} ${i}" loading="lazy"><div class="cap">${t('cap')} ${i}</div>`;
        card.onclick=()=>openLightbox(src);
        grid.appendChild(card);
      }
      if(!grid.children.length){
        const d=document.createElement('div'); d.style.color='#666'; d.textContent='No images found under /assets/imgs/product-3/ (1.png / 1.jpg …)';
        grid.appendChild(d);
      }
    }

    // Lightbox zoom/pan
    const box=document.getElementById('box');
    const big=document.getElementById('big');
    const stage=document.getElementById('stage');
    let scale=1, tx=0, ty=0, startX=0, startY=0, dragging=false, naturalW=0, naturalH=0;

    function apply(){ big.style.transform=`translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${scale})`; }
    function fit(){ scale=1; tx=0; ty=0; apply(); }
    function zoomAt(cx,cy,delta){ 
      const prev=scale;
      scale=Math.min(8,Math.max(1,scale*(delta>0?1.2:1/1.2)));
      const rect=big.getBoundingClientRect();
      const dx=cx-rect.left-rect.width/2;
      const dy=cy-rect.top-rect.height/2;
      tx += dx/prev - dx/scale;
      ty += dy/prev - dy/scale;
      apply();
    }

    function openLightbox(src){
      // Try full.* beside /assets/imgs/product-3/
      const fullBase='../assets/imgs/product-3/full';
      firstExisting(exts.map(e=>`${fullBase}.${e}`)).then(best=>{
        big.src=best || src;
      });
      big.onload=()=>{ naturalW=big.naturalWidth; naturalH=big.naturalHeight; fit(); };
      box.classList.add('show');
    }
    function closeBox(){ box.classList.remove('show'); }

    // Events
    document.getElementById('close').onclick=closeBox;
    document.getElementById('fit').onclick=fit;
    document.getElementById('zin').onclick=()=>zoomAt(window.innerWidth/2,window.innerHeight/2,1);
    document.getElementById('zout').onclick=()=>zoomAt(window.innerWidth/2,window.innerHeight/2,-1);
    box.addEventListener('click',e=>{ if(e.target===box) closeBox(); });
    window.addEventListener('keydown',e=>{ if(e.key==='Escape') closeBox(); });

    stage.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(e.clientX,e.clientY, e.deltaY<0?1:-1 ); }, {passive:false});

    stage.addEventListener('pointerdown',e=>{ dragging=true; startX=e.clientX; startY=e.clientY; stage.setPointerCapture(e.pointerId); });
    stage.addEventListener('pointerup',e=>{ dragging=false; stage.releasePointerCapture(e.pointerId); });
    stage.addEventListener('pointermove',e=>{ if(!dragging) return; tx += e.clientX-startX; ty += e.clientY-startY; startX=e.clientX; startY=e.clientY; apply(); });

    stage.addEventListener('dblclick',e=>{ e.preventDefault(); scale = (scale===1?2:1); apply(); });

    build();
  </script>
</body>
</html>
